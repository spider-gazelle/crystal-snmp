---
name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - "**.md"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Check formatting
        run: crystal tool format --check

      - name: Install dependencies
        run: shards install

      - name: Run static code analysis
        run: crystal run lib/ameba/src/cli.cr

      - name: Build API docs
        run: crystal docs

      - name: Type-check the README examples
        run: |
          for example in examples/*.cr; do
            crystal build --no-codegen "$example"
          done

  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
        crystal: [latest, nightly]
    steps:
      - name: Git checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}

      - name: Install dependencies
        run: shards install --without-development

      - name: Run tests
        run: crystal spec --error-trace --tag '~e2e' --tag '~legacy'

      - name: Run tests (multi-threaded)
        run: crystal spec --error-trace --tag '~e2e' --tag '~legacy'
        env:
          SNMP_SPEC_WORKERS: "4"

      - name: Install Net-SNMP (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q snmp snmpd

      - name: Install Net-SNMP (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install net-snmp
          net_snmp_prefix="$(brew --prefix net-snmp)"
          echo "$net_snmp_prefix/bin" >> "$GITHUB_PATH"
          echo "$net_snmp_prefix/sbin" >> "$GITHUB_PATH"

      - name: Run tests (OpenSSL legacy / DES)
        run: crystal spec --error-trace --tag legacy
        env:
          OPENSSL_CONF: ${{ github.workspace }}/.mise/openssl-legacy.cnf

      - name: Run tests (live agent)
        shell: bash
        env:
          OPENSSL_CONF: ${{ github.workspace }}/.mise/openssl-legacy.cnf
          TEST_SNMP_SERVER: 127.0.0.1
          TEST_SNMP_PORT: "16161"
          MIBS: ""
        run: |
          export SNMP_PERSISTENT_DIR
          SNMP_PERSISTENT_DIR="$(mktemp -d "$RUNNER_TEMP/snmpd.XXXXXX")"
          log="$SNMP_PERSISTENT_DIR/snmpd.log"
          snmpd -C -c "$GITHUB_WORKSPACE/spec/support/snmpd.conf" -Lo -f > "$log" 2>&1 &
          agent_pid=$!
          cleanup() {
            kill "$agent_pid" 2>/dev/null || true
            wait "$agent_pid" 2>/dev/null || true
            cat "$log"
          }
          trap cleanup EXIT

          for attempt in {1..10}; do
            if snmpget -v2c -c public -r 0 -t 1 -On "udp:$TEST_SNMP_SERVER:$TEST_SNMP_PORT" .1.3.6.1.2.1.1.4.0; then
              break
            fi
            if ! kill -0 "$agent_pid" || [[ "$attempt" == 10 ]]; then
              exit 1
            fi
            sleep 1
          done

          crystal spec --error-trace --tag e2e
